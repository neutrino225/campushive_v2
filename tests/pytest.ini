[pytest]
# Pytest configuration for CampusHive tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=app
    --cov=multiagent
    --cov-report=html:tests/reports/coverage
    --cov-report=term-missing
    --html=tests/reports/html/report.html
    --self-contained-html

# Markers
markers =
    agent: Tests for AI agents (RAG, ReAct, etc.)
    api: API endpoint tests
    auth: Authentication and authorization tests
    admin: Admin-only endpoint tests
    evaluation: Evaluation and quality metrics tests
    experiment: Dataset-based experiments
    slow: Tests that take longer to run (>10s)
    llm: Tests that require LLM API calls
    llm_as_judge: LLM-based evaluation tests
    integration: Integration tests across components

# Timeout (prevent hanging tests)
timeout = 300

# Asyncio
asyncio_mode = auto

# Coverage options
[coverage:run]
source = 
    app
    multiagent
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = tests/reports/coverage
