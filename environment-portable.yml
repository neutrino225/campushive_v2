name: fyp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific computing
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - jupyter

  # ML/AI frameworks
  - pytorch
  - transformers

  # Web and API
  - requests
  - beautifulsoup4
  - fastapi
  - uvicorn

  # Database and storage
  - sqlite
  - psycopg2

  # Development tools
  - pytest
  - black
  - flake8

  # System dependencies (let conda resolve versions)
  - openssl
  - ca-certificates
  - libgcc-ng
  - libstdcxx-ng

  # Pip dependencies (main project requirements)
  - pip:
      # LangChain ecosystem
      - langchain>=0.3.0,<0.4.0
      - langchain-community>=0.3.0,<0.4.0
      - langchain-core>=0.3.0,<0.4.0
      - langchain-text-splitters>=0.3.0,<0.4.0
      - langchain-chroma>=0.2.0,<0.3.0
      - langchain-groq>=0.3.0,<0.4.0
      - langchain-google-genai>=2.0.0,<3.0.0
      - langchain-ollama>=0.3.0,<0.4.0

      # LangGraph
      - langgraph>=0.4.0,<0.5.0
      - langgraph-checkpoint>=2.0.0,<3.0.0
      - langgraph-prebuilt>=0.2.0,<0.3.0

      # AI/ML APIs
      - groq>=0.30.0,<1.0.0
      - openai>=1.80.0,<2.0.0
      - ollama>=0.5.0,<1.0.0

      # FastAPI and web
      - fastapi>=0.115.0,<1.0.0
      - uvicorn[standard]>=0.30.0,<1.0.0
      - pydantic>=2.10.0,<3.0.0
      - pydantic-settings>=2.10.0,<3.0.0

      # Vector stores and embeddings
      - chromadb>=0.5.0,<1.0.0
      - sentence-transformers>=3.0.0,<4.0.0

      # Text processing
      - nltk>=3.9.0,<4.0.0
      - rapidfuzz>=3.10.0,<4.0.0
      - rank-bm25>=0.2.0,<1.0.0

      # Document processing
      - pypdf>=5.0.0,<6.0.0
      - unstructured>=0.17.0,<1.0.0
      - python-magic>=0.4.0,<1.0.0
      - pillow>=10.0.0,<11.0.0

      # Data manipulation
      - openpyxl>=3.1.0,<4.0.0
      - tabulate>=0.9.0,<1.0.0

      # Utilities
      - python-dotenv>=1.0.0,<2.0.0
      - rich>=13.0.0,<14.0.0
      - typer>=0.12.0,<1.0.0
      - httpx>=0.28.0,<1.0.0
      - tenacity>=9.0.0,<10.0.0

      # Development and testing
      - pytest>=8.0.0,<9.0.0
      - pytest-asyncio>=0.24.0,<1.0.0
      - black>=24.0.0,<25.0.0
      - isort>=5.13.0,<6.0.0
